# The rig on the phone.

# The MediaMTX the server runs and keeps running, receiving the Pixel 9's
# SRT livestream. dir (its working directory, where it finds mediamtx.yml)
# defaults to the executable's directory and log to mediamtx.log in it.
[mediamtx]
path = "/data/local/tmp/mc/mtx/mediamtx"

# Sony bodies, each joined on its own Wi-Fi interface. endpoint is optional
# and defaults to the bodies' fixed camera service. start_gap is how long a
# start waits after the body reports IDLE: the RX100M6 refuses one sooner
# than 3 s after a stop.
[[camera]]
name = "rx10m4"
kind = "sony"
interface = "wlan1"

[[camera]]
name = "rx100m6"
kind = "sony"
interface = "cam2"
start_gap = "3s"

# The Pixel 9, driven through Blackmagic Camera's HTTP server on the home
# LAN; its picture is the app's livestream, received by MediaMTX on this
# phone under the camera's name.
[[camera]]
name = "pixel9"
kind = "blackmagic"
address = "192.168.1.109:4444"

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>multicam</title>
<style>
html, body { height: 100%; margin: 0 }
body { height: 100dvh; display: flex; flex-direction: column; background: #000; color: #fff; font: 13px/1.3 system-ui, sans-serif }
button { margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent }

/* The bar: Start all at the left, Stop all at the right, the console's own error between. */
header { flex: none; height: 40px; display: flex; align-items: center }
header button { height: 100%; padding: 0 14px; display: flex; align-items: center; gap: 6px }
header button::before { content: ""; box-sizing: border-box; width: 20px; height: 20px }
#start::before { border: 2px solid #fff; border-radius: 50%; background: #e00 }
#stop::before { border-radius: 2px; background: #fff }
#fault { flex: 1; min-width: 0; overflow: hidden; text-align: center; text-overflow: ellipsis; white-space: nowrap; color: #fd0 }

/* The tiles share the height under the bar; each picture is fitted whole in its tile. */
main { flex: 1; min-height: 0; display: flex; flex-direction: column }
.tile { flex: 1 1 0; min-height: 0; position: relative; display: block; width: 100%; overflow: hidden }
.tile img, .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none }
.name { position: absolute; top: 12px; left: 12px; padding: 1px 6px; border-radius: 3px; background: rgba(0, 0, 0, .55); font-size: 12px }

/* The corner mark is what a tap does: a record disc, or a stop square while recording. */
.mark { position: absolute; top: 12px; right: 12px; box-sizing: border-box; width: 22px; height: 22px; border: 2px solid #fff; border-radius: 50%; background: #e00; box-shadow: 0 0 0 1px rgba(0, 0, 0, .5) }
.recording .mark { border: 0; border-radius: 3px; background: #fff; box-shadow: 0 0 0 2px rgba(0, 0, 0, .6) }

/* The frame: red while recording, dashed when the camera's status is unread. */
.tile::after { content: ""; position: absolute; inset: 0; pointer-events: none }
.tile.recording::after { border: 8px solid #f00 }
.tile.recording.stale::after { border-style: dashed }

.error { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; background: rgba(0, 0, 0, .8); color: #fd0; text-align: left; white-space: pre-line; overflow-wrap: anywhere }
.error:empty { display: none }
</style>
<header>
<button id="start" aria-label="Start all">all</button>
<output id="fault"></output>
<button id="stop" aria-label="Stop all">all</button>
</header>
<main>
{{range .Cameras}}<button class="tile" data-camera="{{.Name}}">
{{if .Stream}}<video autoplay muted playsinline data-whep=":{{$.WHEPPort}}/{{.Stream}}/whep"></video>
{{else}}<img src="/{{.Name}}/liveview" alt="{{.Name}} liveview">
{{end}}<span class="name">{{.Name}}</span>
<span class="mark"></span>
<span class="error"></span>
</button>
{{end}}</main>
<script>
const start = document.getElementById('start');
const stop = document.getElementById('stop');
const fault = document.getElementById('fault');

// A tile's state: the camera's last known recording status, what the last
// tap asked for while the camera has yet to agree (null otherwise), the error
// of its watch, and the refusal of its last command. A relayed picture whose
// request fails is requested again 2 s later.
const tiles = new Map();
for (const el of document.querySelectorAll('.tile')) {
	const t = {el, error: el.querySelector('.error'), img: el.querySelector('img'), recording: false, intent: null, fault: '', refusal: ''};
	tiles.set(el.dataset.camera, t);
	if (t.img) t.img.onerror = () => setTimeout(() => { t.img.src = t.img.src.split('?')[0] + '?' + Date.now(); }, 2000);
	el.onclick = () => command('/' + encodeURIComponent(el.dataset.camera), [t], !shown(t));
}
const all = [...tiles.values()];
start.onclick = () => command('', all, true);
stop.onclick = () => command('', all, false);

// shown is what a tile's mark shows: the tap's intent until the camera
// agrees or refuses, else the camera's state.
function shown(t) { return t.intent ?? t.recording; }

// draw shows every tile's state. A status is unread when its camera's watch
// failed or the console's events aren't arriving.
function draw() {
	const unanswered = fault.textContent !== '';
	for (const t of all) {
		t.el.classList.toggle('recording', shown(t));
		t.el.classList.toggle('stale', unanswered || t.fault !== '');
		t.error.textContent = [...new Set([t.refusal, t.fault])].filter(Boolean).join('\n');
	}
}

// command makes recording the intent of the tiles ts, shows it, and sends
// the start or stop under base: a tap is never held back, the console queues
// what a camera can't take yet. A camera whose report carries an error
// refused, or is unread and can't confirm: its tile shows the error and its
// last known state. One that agrees is shown agreeing by the console's
// events.
async function command(base, ts, recording) {
	for (const t of ts) t.intent = recording;
	draw();
	const path = base + (recording ? '/start' : '/stop');
	try {
		const r = await fetch(path, {method: 'POST'});
		if (!r.ok) throw new Error('POST ' + path + ': ' + r.status);
		for (const s of (await r.json()).cameras) {
			const t = tiles.get(s.name);
			t.refusal = s.error || '';
			if (t.refusal) t.intent = null;
		}
		fault.textContent = '';
	} catch (e) {
		for (const t of ts) t.intent = null;
		fault.textContent = 'console: ' + e.message;
	}
	draw();
}

// The console pushes every camera's state on connection and then each
// change, always the newest. A state that matches a tile's intent is the
// camera agreeing. The browser reconnects a dropped stream by itself and the
// states arrive again.
const events = new EventSource('/events');
events.onopen = () => {
	fault.textContent = '';
	draw();
};
events.onerror = () => {
	fault.textContent = 'console: events disconnected';
	draw();
};
events.onmessage = e => {
	const s = JSON.parse(e.data);
	const t = tiles.get(s.name);
	if (!t) return;
	if ('recording' in s) {
		t.recording = s.recording;
		t.fault = '';
		if (t.intent === t.recording) t.intent = null;
	} else {
		t.fault = s.error;
	}
	draw();
};

// play shows the stream at the WHEP endpoint url in video: the browser's
// offer is posted and the answer set. The connection is made again 2 s
// after it fails or ends.
function play(video, url) {
	const pc = new RTCPeerConnection();
	let over = false;
	const again = () => {
		if (over) return;
		over = true;
		pc.close();
		setTimeout(() => play(video, url), 2000);
	};
	pc.addTransceiver('video', {direction: 'recvonly'});
	pc.ontrack = e => { video.srcObject = e.streams[0] || new MediaStream([e.track]); };
	pc.onconnectionstatechange = () => {
		if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) again();
	};
	(async () => {
		await pc.setLocalDescription(await pc.createOffer());
		await gathered(pc);
		const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/sdp'}, body: pc.localDescription.sdp});
		if (!r.ok) throw new Error('POST ' + url + ': ' + r.status);
		await pc.setRemoteDescription({type: 'answer', sdp: await r.text()});
	})().catch(again);
}

// gathered resolves once pc's ICE candidates are gathered, or after 1 s.
function gathered(pc) {
	return new Promise(resolve => {
		if (pc.iceGatheringState === 'complete') return resolve();
		const timer = setTimeout(resolve, 1000);
		pc.onicegatheringstatechange = () => {
			if (pc.iceGatheringState === 'complete') {
				clearTimeout(timer);
				resolve();
			}
		};
	});
}

for (const v of document.querySelectorAll('video[data-whep]')) play(v, 'http://' + location.hostname + v.dataset.whep);
</script>
